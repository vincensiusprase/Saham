name: IDX Valuation Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# JADWAL
# GitHub Actions memakai zona waktu UTC. WIB = UTC+7.
# Cron di bawah: Sabtu 06:30 UTC = Sabtu 13:30 WIB.
#
# Format cron:  menit  jam  tanggal  bulan  hari(0=Min..6=Sab)
# Ubah jam bila perlu, mis. 01:30 WIB Sabtu = Jumat 18:30 UTC -> "30 18 * * 5".
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "30 6 * * 6"      # Sabtu 13:30 WIB
  workflow_dispatch:           # tombol "Run workflow" manual di tab Actions

permissions:
  contents: read               # hak akses minimum

jobs:
  run-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 350       # 950 saham butuh waktu; batas maksimum job = 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Rahasia disuntikkan dari repository secrets (Settings > Secrets).
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          # Opsional: override spreadsheet id dari secret/var, kalau di-set.
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
        run: python main.py
